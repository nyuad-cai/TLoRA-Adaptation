experiment_name: task1_deepseek 

model:
  type: deepseek            #model handler type as written in models/__init__.py
  name: deepseek-chat  # just as it appears in huggingface

cache_dir: /scratch/ca2627/huggingface #modify to your own cache directory

dataset:
  path: datasets/qa/mmlu-arabic.json   #path to dataset JSON file
  instruction_path: prompts/task1.txt  #path to instruction file (default.txt)

task:
  type: mcq                #task 1: mcq or task 2: answer_generation

output:
  predictions_path: results/predictions/task1/mmlu/deepseek.csv #specify output pred file
  metrics_path: results/metrics/task1/mmlu/deepseek.json  #specift output pred file


