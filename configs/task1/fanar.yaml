experiment_name: task1_fanar 

model:
  type: fanar           #model handler type as written in models/__init__.py
  name: QCRI/Fanar-1-9B  # just as it appears in huggingface

cache_dir: /scratch/ca2627/huggingface #modify to your own cache directory

dataset:
  path: datasets/qa/medarabench.json   #path to dataset JSON file
  instruction_path: prompts/task1.txt  #path to instruction file (default.txt)

task:
  type: mcq                #task 1: mcq or task 2: answer_generation

output:
  predictions_path: results/predictions/task1/medarabench/fanar.csv #specify output pred file
  metrics_path: results/metrics/task1/medarabench/fanar.json  #specift output pred file


